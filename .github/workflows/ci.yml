name: CI

on:
  pull_request:
    branches: [ master, develop ]
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore QueryCache.slnx
      - run: dotnet build QueryCache.slnx --configuration Release --no-restore
      - run: dotnet test --project tests/QueryCache.Tests/QueryCache.Tests.csproj --configuration Release --no-build
